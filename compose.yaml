name: adaptive-gateway

x-runtime: &runtime
  init: true
  mem_limit: 512m
  cpus: 1.0
  healthcheck:
    test: ["CMD-SHELL", "curl --fail --silent --max-time 2 http://localhost:8080/actuator/health/readiness >/dev/null"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 15s

services:
  inventory:
    <<: *runtime
    image: adaptive-gateway-inventory:week1
    build:
      context: .
      args:
        JAR_FILE: inventory/target/inventory-0.0.1-SNAPSHOT.jar
    environment:
      INVENTORY_PORT: 8080
  checkout:
    <<: *runtime
    image: adaptive-gateway-checkout:week1
    build:
      context: .
      args:
        JAR_FILE: checkout/target/checkout-0.0.1-SNAPSHOT.jar
    environment:
      CHECKOUT_PORT: 8080
      INVENTORY_BASE_URL: http://inventory:8080
    depends_on:
      inventory:
        condition: service_healthy
  gateway:
    <<: *runtime
    image: adaptive-gateway-gateway:week1
    build:
      context: .
      args:
        JAR_FILE: gateway/target/gateway-0.0.1-SNAPSHOT.jar
    environment:
      GATEWAY_PORT: 8080
      INVENTORY_BASE_URL: http://inventory:8080
      CHECKOUT_BASE_URL: http://checkout:8080
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      inventory:
        condition: service_healthy
      checkout:
        condition: service_healthy
