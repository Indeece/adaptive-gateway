spring.application.name=checkout
server.port=${CHECKOUT_PORT:8081}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

server.tomcat.threads.max=100
server.tomcat.mbeanregistry.enabled=true

observability.snapshots.enabled=${SNAPSHOTS_ENABLED:false}
observability.snapshots.file=${SNAPSHOT_FILE:target/snapshots/checkout.jsonl}
observability.run-id=${RUN_ID:manual}

upstream.inventory.base-url=${INVENTORY_BASE_URL:http://localhost:8082}
