global:
  scrape_interval: 1s
  scrape_timeout: 900ms

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [gateway:8080]

  - job_name: checkout
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [checkout:8080]

  - job_name: inventory
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [inventory:8080]
