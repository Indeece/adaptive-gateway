name: adaptive-gateway

x-runtime: &runtime
  init: true
  mem_limit: 512m
  cpus: 1.0
  healthcheck:
    test: ["CMD-SHELL", "curl --fail --silent --max-time 2 http://localhost:8080/actuator/health/readiness >/dev/null"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 15s

services:
  inventory:
    <<: *runtime
    image: adaptive-gateway-inventory:week1
    build:
      context: .
      args:
        JAR_FILE: inventory/target/inventory-0.0.1-SNAPSHOT.jar
    environment:
      INVENTORY_PORT: 8080
      ACTUATOR_ENDPOINTS: health,prometheus
      INVENTORY_SPLIT_POOLS: ${INVENTORY_SPLIT_POOLS:-false}
      INVENTORY_FAULT_CONTROL_ENABLED: "true"
      SNAPSHOTS_ENABLED: ${SNAPSHOTS_ENABLED:-false}
      SNAPSHOT_FILE: /tmp/snapshots/inventory.jsonl
      RUN_ID: ${RUN_ID:-manual}
  checkout:
    <<: *runtime
    image: adaptive-gateway-checkout:week1
    build:
      context: .
      args:
        JAR_FILE: checkout/target/checkout-0.0.1-SNAPSHOT.jar
    environment:
      CHECKOUT_PORT: 8080
      ACTUATOR_ENDPOINTS: health,prometheus
      SNAPSHOTS_ENABLED: ${SNAPSHOTS_ENABLED:-false}
      SNAPSHOT_FILE: /tmp/snapshots/checkout.jsonl
      RUN_ID: ${RUN_ID:-manual}
      INVENTORY_BASE_URL: http://inventory:8080
    depends_on:
      inventory:
        condition: service_healthy
  gateway:
    <<: *runtime
    image: adaptive-gateway-gateway:week1
    build:
      context: .
      args:
        JAR_FILE: gateway/target/gateway-0.0.1-SNAPSHOT.jar
    environment:
      GATEWAY_PORT: 8080
      ACTUATOR_ENDPOINTS: health,prometheus
      SNAPSHOTS_ENABLED: ${SNAPSHOTS_ENABLED:-false}
      SNAPSHOT_FILE: /tmp/snapshots/gateway.jsonl
      RUN_ID: ${RUN_ID:-manual}
      INVENTORY_BASE_URL: http://inventory:8080
      CHECKOUT_BASE_URL: http://checkout:8080
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      inventory:
        condition: service_healthy
      checkout:
        condition: service_healthy

  prometheus:
    profiles: [monitoring, load]
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /dashboards/gateway.json
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/gateway.json:/dashboards/gateway.json:ro
    configs:
      - source: grafana-datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana-dashboard
        target: /etc/grafana/provisioning/dashboards/gateway.yml
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  k6:
    profiles: [load]
    image: grafana/k6:2.4.0
    command: ["run", "--quiet", "/load.js"]
    environment:
      GATEWAY_URL: http://gateway:8080
      INVENTORY_URL: http://inventory:8080
      QUOTES_RPS: 50
      AVAILABILITY_RPS: 15
      WARMUP_SECONDS: 20
      NORMAL_SECONDS: 30
      FAULT_SECONDS: 30
      RECOVERY_SECONDS: 30
      DRAIN_SECONDS: 3
      REQUEST_TIMEOUT_MS: 1200
      QUOTES_SLO_MS: 280
      AVAILABILITY_SLO_MS: 100
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 1s
      K6_PROMETHEUS_RW_STALE_MARKERS: "true"
      K6_PROMETHEUS_RW_TREND_STATS: p(90)
    volumes:
      - ./experiments/load.js:/load.js:ro
    depends_on:
      gateway:
        condition: service_healthy
      prometheus:
        condition: service_healthy

volumes:
  prometheus-data:
  grafana-data:

configs:
  grafana-datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false
          jsonData:
            timeInterval: 1s
  grafana-dashboard:
    content: |
      apiVersion: 1
      providers:
        - name: Adaptive Gateway
          type: file
          options:
            path: /dashboards
